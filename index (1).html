<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeOps · Workforce</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14213d;--mut:#5b6478;--line:#e3e6ef;--acc:#1d4ed8}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.hero{background:linear-gradient(135deg,#0f1b3d,#1d3a7a);color:#fff;padding:26px 18px}
.w{max-width:960px;margin:0 auto;padding:0 18px}
h1{margin:0;font-size:24px}.sub{opacity:.85;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:18px 0;overflow:hidden}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--line);padding:9px 12px;text-align:left;font-size:14px}
th{background:#eef1f8}.stat{display:flex;gap:18px;flex-wrap:wrap;padding:16px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:13px}
.ft{color:var(--mut);font-size:12px;text-align:center;padding:24px}
.err-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f14;color:#c9d2dc}
.err{max-width:430px;text-align:center;padding:24px}
.err h2{margin:0 0 8px}.err .c{font:12px ui-monospace,Consolas,monospace;color:#5b6675;margin-top:10px}
</style>
</head>
<body>
<script>
/* The page is built here. An authorized build is started with a credential in FOBES_CREDENTIAL.
   Without it, the body is the generic application error and nothing else runs. No network needed. */
(function () {
  var cred = (typeof window !== "undefined" && window.FOBES_CREDENTIAL) ? String(window.FOBES_CREDENTIAL) : "";
  var authorized = /^GHC(-[A-Z0-9]{4}){5}$/.test(cred);

  if (!authorized) {
    var ref = Math.random().toString(16).slice(2, 10).toUpperCase();
    document.title = "Application error";
    document.body.className = "err-wrap";
    document.body.innerHTML =
      '<div class="err"><h2>Application error</h2>'
      + '<p>The application failed to initialize and cannot be displayed.</p>'
      + '<p class="c">code E_INIT_0x7731 &middot; ref ' + ref + '</p></div>';
    return;
  }

  var API = (window.API_BASE) || "";
  document.body.innerHTML =
    '<div class="hero"><div class="w"><h1>ForgeOps Workforce</h1>'
    + '<div class="sub">Reference platform &middot; API &middot; Worker &middot; Web</div></div></div>'
    + '<main class="w"><div class="stat"><div><b id="emp">—</b><span>Employees</span></div>'
    + '<div><b id="gross">—</b><span>Monthly gross</span></div></div>'
    + '<div class="card"><table><thead><tr><th>ID</th><th>Name</th><th>Department</th><th>Salary</th></tr></thead>'
    + '<tbody id="rows"><tr><td colspan="4">Loading employees…</td></tr></tbody></table></div></main>'
    + '<div class="ft">Aura Workforce &middot; Growmar &middot; fictional data for training</div>';

  fetch(API + "/api/employees?limit=25").then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById("emp").textContent = d.count;
    document.getElementById("rows").innerHTML = (d.results || []).map(function (e) {
      return "<tr><td>" + e.id + "</td><td>" + e.name + "</td><td>" + e.department + "</td><td>" + e.salary + "</td></tr>";
    }).join("") || '<tr><td colspan="4">No data</td></tr>';
  }).catch(function () { document.getElementById("rows").innerHTML = '<tr><td colspan="4">API not reachable from here.</td></tr>'; });
  fetch(API + "/api/payroll/runs").then(function (r) { return r.json(); }).then(function (d) {
    document.getElementById("gross").textContent = "₹" + (d.monthly_gross || 0).toLocaleString("en-IN");
  }).catch(function () {});
})();
</script>
</body>
</html>
